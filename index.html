<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noct Information Security - Labs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: #1a1a2e; color: #c9d1d9;
    }
    .card {
      text-align: center; padding: 3rem; max-width: 600px;
    }
    h1 { color: #b388ff; margin-bottom: 0.5rem; font-size: 2rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; }
    .courses { list-style: none; }
    .courses li { margin: 0.75rem 0; }
    .courses a {
      color: #b388ff; text-decoration: none; font-size: 1.125rem;
      padding: 0.75rem 1.5rem; display: inline-block;
      border: 1px solid #30363d; border-radius: 8px;
      background: #21213a; transition: all 0.2s;
    }
    .courses a:hover:not(.unavailable) {
      background: #2d2b55; border-color: #b388ff;
    }
    .courses a.unavailable {
      color: #484f58; border-color: #21213a; cursor: default;
      pointer-events: none;
    }
    .courses a .status {
      display: block; font-size: 0.75rem; margin-top: 0.25rem;
      color: #484f58;
    }
    .footer { margin-top: 2rem; color: #484f58; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Noct Labs</h1>
    <p class="subtitle">Training lab guides by Noct Information Security</p>
    <ul class="courses">
      <li><a href="/Foundations-Of-SecOps/" data-course>Foundations of Security Operations</a></li>
      <li><a href="/Detection-Engineering-101/" data-course>Detection Engineering 101</a></li>
    </ul>
    <p class="footer">Noct Information Security, LLC</p>
  </div>
  <script>
    document.querySelectorAll('a[data-course]').forEach(function(link) {
      fetch(link.href, { method: 'HEAD', mode: 'no-cors' })
        .then(function(res) {
          if (!res.ok && res.status !== 0) {
            markUnavailable(link);
          }
        })
        .catch(function() {
          markUnavailable(link);
        });

      // Also check by loading the page content to detect the unpublish page
      fetch(link.href)
        .then(function(res) {
          if (!res.ok) {
            markUnavailable(link);
            return;
          }
          return res.text();
        })
        .then(function(html) {
          if (html && html.includes('Labs Currently Unavailable')) {
            markUnavailable(link);
          }
        })
        .catch(function() {
          markUnavailable(link);
        });
    });

    function markUnavailable(link) {
      if (link.classList.contains('unavailable')) return;
      link.classList.add('unavailable');
      link.removeAttribute('href');
      var status = document.createElement('span');
      status.className = 'status';
      status.textContent = 'Currently unavailable';
      link.appendChild(status);
    }
  </script>
</body>
</html>
